[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luxury-car-opportunity-desk"
version = "0.1.0"
description = "Local single-user research prototype linking permitted vehicle observations, comparable prices, business prospects and buyer requirements."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0",
]
website = [
  # Only needed if the optional approved-website adapter is enabled.
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
desk = "desk.cli:main"

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.setuptools.package-data]
desk = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:desk.*"]
